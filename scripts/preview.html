<!doctype html><meta charset="utf-8"><title>README preview</title>
<script>const T=new URLSearchParams(location.search).get('t')||'light';
document.write(`<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-${T}.css">`)</script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>body{margin:0;padding:24px 16px;background:var(--bg)}
.box{max-width:878px;margin:auto;border:1px solid var(--bd);border-radius:6px;padding:24px}
.hd{font:12px ui-monospace,monospace;color:var(--fg);margin:0 0 16px}</style>
<script>document.documentElement.style.setProperty('--bg',T==='dark'?'#0d1117':'#ffffff');
document.documentElement.style.setProperty('--bd',T==='dark'?'#3d444d':'#d1d9e0');
document.documentElement.style.setProperty('--fg',T==='dark'?'#9198a1':'#59636e');</script>
<div class="box"><div class="hd">ArnavParashar49 / README.md</div><article class="markdown-body" id="md"></article></div>
<script>
fetch('../README.md').then(r=>r.text()).then(src=>{
  src=src.replaceAll('https://raw.githubusercontent.com/ArnavParashar49/ArnavParashar49/main/assets/','../assets/');
  const el=document.getElementById('md'); el.innerHTML=marked.parse(src);
  el.querySelectorAll('picture').forEach(p=>{const s=p.querySelector('source');const i=p.querySelector('img');
    if(T==='dark'&&s) i.src=s.getAttribute('srcset'); if(s) s.remove();});
});
</script>
